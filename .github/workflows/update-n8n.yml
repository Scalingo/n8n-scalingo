name: Update n8n

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-n8n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Get latest stable n8n version
        id: n8n-version
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: 'n8n-io',
              repo: 'n8n',
              tag: 'stable',
            });

            const target = release.data.target_commitish ?? '';
            const body = release.data.body ?? '';
            const version = target.match(/^release\/(\d+\.\d+\.\d+)$/)?.[1]
              ?? body.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];

            if (!version) {
              core.setFailed(`Unable to determine stable n8n version from release ${release.data.html_url}`);
              return;
            }

            core.info(`Latest stable n8n version is ${version}`);
            core.setOutput('version', version);

      - name: Check whether n8n changed
        id: n8n-change
        run: |
          current_version=$(node -p "require('./package.json').dependencies.n8n.match(/\d+\.\d+\.\d+/)?.[0] ?? ''")
          stable_version="${{ steps.n8n-version.outputs.version }}"

          if [ "$current_version" = "$stable_version" ]; then
            echo "n8n is already at stable version $stable_version"
            echo "update-needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "n8n will be updated from $current_version to $stable_version"
            echo "update-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze n8n dependency
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm pkg set dependencies.n8n="${{ steps.n8n-version.outputs.version }}"

      - name: Update n8n dependency
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm update n8n

      - name: Install dependencies
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm install

      - name: Verify clean install
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm ci

      - name: Create pull request
        if: steps.n8n-change.outputs.update-needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_VERSION: ${{ steps.n8n-version.outputs.version }}
        run: |
          branch="deps/n8n/$N8N_VERSION"
          title="deps(n8n) Bump n8n to $N8N_VERSION"

          # GitHub Actions does not set a commit author by default.
          # Bot identity from https://github.com/orgs/community/discussions/26560
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"

          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git commit -m "$title"
          git push --force-with-lease origin "$branch"

          cat > /tmp/update-n8n-pr-body.md <<EOF
            Updates n8n to the latest stable release: \`$N8N_VERSION\`

            This workflow ran:
            - \`npm update n8n\`
            - \`npm install\`
            - \`npm ci\`
          EOF

          if gh pr view "$branch" --json url --jq .url; then
            gh pr edit "$branch" \
              --title "$title" \
              --body-file /tmp/update-n8n-pr-body.md \
              --add-reviewer leo-scalingo \
              --add-reviewer Frzk
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "$title" \
              --body-file /tmp/update-n8n-pr-body.md \
              --reviewer leo-scalingo \
              --reviewer Frzk
          fi
