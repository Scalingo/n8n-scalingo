name: Update n8n

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-n8n:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Get latest stable n8n version
        id: n8n-version
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: 'n8n-io',
              repo: 'n8n',
              tag: 'stable',
            });

            const target = release.data.target_commitish ?? '';
            const body = release.data.body ?? '';
            const version = target.match(/^release\/(\d+\.\d+\.\d+)$/)?.[1]
              ?? body.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];

            if (!version) {
              core.setFailed(`Unable to determine stable n8n version from release ${release.data.html_url}`);
              return;
            }

            core.info(`Latest stable n8n version is ${version}`);
            core.setOutput('version', version);

      - name: Check whether n8n changed
        id: n8n-change
        run: |
          current_version="$( node -p "require('./package.json').dependencies.n8n.match(/\d+\.\d+\.\d+/)?.[0] ?? ''" )"
          stable_version="${{ steps.n8n-version.outputs.version }}"

          if [ "$current_version" = "$stable_version" ]; then
            echo "n8n is already at stable version $stable_version"
            echo "update-needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "n8n will be updated from $current_version to $stable_version"
            echo "update-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Freeze n8n dependency
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm pkg set dependencies.n8n="${{ steps.n8n-version.outputs.version }}"

      - name: Update n8n dependency
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm update n8n

      - name: Install dependencies
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm install

      - name: Verify clean install
        if: steps.n8n-change.outputs.update-needed == 'true'
        run: npm ci

      - name: Create pull request
        if: steps.n8n-change.outputs.update-needed == 'true'
        uses: Scalingo/actions/create-pull-request@6c9f4f817da725c2584e54784e539d0997ed7d3e
        with:
          commit-message: "deps(n8n) Bump n8n to ${{ steps.n8n-version.outputs.version }}"
          title: "deps(n8n) Bump n8n to ${{ steps.n8n-version.outputs.version }}"
          body: |
            Updates n8n to the latest stable release: `${{ steps.n8n-version.outputs.version }}`

            This workflow ran:
              - `npm update n8n`
              - `npm install`
              - `npm ci`
          branch: deps/n8n/${{ steps.n8n-version.outputs.version }}
          sign-commits: true
          reviewers: leo-scalingo,Frzk
